name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-core:
    name: axe-core Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run axe-core a11y tests
        run: npm run test:a11y
      - name: Annotate failures
        if: failure()
        run: echo "::error::Accessibility regression detected — axe-core tests failed. Run 'npm run test:a11y' locally to reproduce."

  storybook-a11y:
    name: Storybook a11y Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright deps (cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Storybook a11y tests
        timeout-minutes: 10
        run: |
          cd packages/core
          npx vitest run --project storybook 2>&1 | tee test-output.log
          TEST_EXIT=$?
          if [ $TEST_EXIT -ne 0 ]; then
            # Check if all tests actually passed (teardown bug workaround)
            if grep -q "Tests.*passed" test-output.log && ! grep -q "Tests.*failed" test-output.log; then
              echo "Tests passed but process exited with error (known Playwright teardown issue)"
              exit 0
            fi
            exit $TEST_EXIT
          fi
