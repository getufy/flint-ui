name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - name: Check for Chromatic token
        id: check-token
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chromatic skipped — CHROMATIC_PROJECT_TOKEN not set"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.check-token.outputs.has_token == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.check-token.outputs.has_token == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.check-token.outputs.has_token == 'true'
      - name: Build Storybook for Chromatic
        if: steps.check-token.outputs.has_token == 'true'
        run: npm run build-storybook
        env:
          CHROMATIC: true
      - name: Run Chromatic
        if: steps.check-token.outputs.has_token == 'true'
        uses: chromaui/action@7ffa9343588f15ff3f4cde30e03cd23204ed6a9c # v17.7.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: packages/core/storybook-static
          # Non-blocking on PRs — visual diffs show as a check but don't fail the build
          exitZeroOnChanges: true
          exitOnceUploaded: true
          # Auto-accept changes on main so the baseline stays current
          autoAcceptChanges: main
          # Skip builds when only non-UI files change
          onlyChanged: true
