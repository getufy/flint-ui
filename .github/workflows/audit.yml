name: Security Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run npm audit
        id: audit
        run: npm audit --audit-level=high
      - name: Create issue on failure
        if: failure() && steps.audit.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Security: npm audit found vulnerabilities (${new Date().toISOString().slice(0, 10)})`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
            });
            if (issues.some(i => i.title.startsWith('Security: npm audit'))) {
              console.log('Open security issue already exists, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## npm audit found vulnerabilities',
                '',
                `The scheduled security audit workflow failed on ${new Date().toISOString().slice(0, 10)}.`,
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please run `npm audit` locally and resolve the reported issues.',
              ].join('\n'),
              labels: ['security'],
            });
